name: Release

# Manual only (Actions -> Release -> Run workflow). Computes the next version
# ONCE, bakes it into the DLL, builds + tests (the `build` job) while the API
# surface is extracted in parallel (the `api` job), then - if both pass - tags
# that version and publishes d2bs.dll + .pdb + d2bsng.d.ts + api.json, then
# deploys the docs.
#
# The version is decided up front (the `version` job) and reused for both the
# baked-in D2BS_VERSION and the git tag, so they can never drift. The release
# concurrency group below serializes runs (cancel-in-progress: false).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored for the first release, which is always 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: v
        run: |
          # Only consider strict vX.Y.Z tags (ignores the v8-... libs tag).
          # `|| true`: grep exits 1 when no vX.Y.Z tag exists yet (first release).
          latest=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            # First d2bsng release starts at 2.0.0 - legacy d2bs topped out at
            # 1.6.x, so 2.x lets scripts identify they're running d2bsng.
            echo "version=2.0.0" >> "$GITHUB_OUTPUT"
          else
            # bump: from the manual dispatch input; empty (push trigger) -> patch.
            bump="${{ inputs.bump }}"; bump="${bump:-patch}"
            IFS='.' read -r major minor patch <<< "${latest#v}"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: version
    runs-on: windows-latest
    env:
      # vcpkg's ABI-keyed binary cache. Caching THIS (not the vcpkg_installed
      # install tree) is what lets a build reuse prebuilt packages: vcpkg re-runs
      # `install` on every build and rebuilds from source unless it finds a
      # matching archive here.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      # Pinned vcpkg commit (tool + builtin registry); matches builtin-baseline
      # in vcpkg.json. Bumping it deliberately invalidates the binary cache.
      VCPKG_REF: 9e44ec0e9f247d77c230ced0ee66c76296837807
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # D2MOO headers only; its external/ submodules are not used
      - name: Restore vcpkg binary cache
        id: vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # run_id (+ job) keeps every save key unique so a fresh build always
          # saves; the prefix restore-keys then pick up the most recent cache.
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'tests/frontends/js-v8/vcpkg.json') }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'tests/frontends/js-v8/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_REF }}-
      - name: Set up pinned vcpkg (binary cache + MSBuild manifest restore)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Pin vcpkg (tool + builtin registry) to a fixed commit so the runner
          # image's bundled vcpkg can't drift our ABI hashes / dependency versions
          # out from under the binary cache. VCPKG_REF matches builtin-baseline in
          # vcpkg.json; integrate install from this copy points MSBuild at it.
          $vcpkgDir = "$env:RUNNER_TEMP\vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg.git $vcpkgDir
          git -C $vcpkgDir checkout --quiet $env:VCPKG_REF
          & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$vcpkgDir\vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integrate failed" }
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The build fetches V8 itself - headers and monolith, out of one archive,
      # into dependencies/v8/<version>/ (Directory.Build.props declares the
      # version; scripts/fetch_v8.ps1 unpacks it before anything compiles). So
      # there is nothing to download here. All this does is stop a runner from
      # pulling over a gigabyte on every run, and it reads the version out of
      # the build rather than restating it, so the key cannot drift from what
      # the build actually wants - and a version bump is a new key and a new
      # directory rather than a stale hit.
      - name: Resolve V8 version
        id: v8
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $node = $props.SelectSingleNode('//V8Version')
          if (-not $node) { throw "V8Version not found in Directory.Build.props" }
          "version=$($node.InnerText.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Cache V8
        uses: actions/cache@v4
        with:
          path: dependencies/v8/${{ steps.v8.outputs.version }}
          key: v8-${{ runner.os }}-${{ steps.v8.outputs.version }}
      - name: Build (Release)
        shell: pwsh
        env:
          # Aptabase app key baked into the DLL (build.ps1 -AnalyticsKey defaults to
          # this variable). Unset secret -> empty -> analytics compiled out; only
          # released builds ever carry a key. See docs/analytics.md.
          D2BS_ANALYTICS_KEY: ${{ secrets.APTABASE_APP_KEY }}
        run: .\build.ps1 Release -Version ${{ needs.version.outputs.version }}
      # Save vcpkg's binary cache right after the build populates it. Always
      # save: the run_id-unique key never collides, and we want the cache kept
      # even if a later step (doc-gen, upload) fails.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      # The solution build above already produced Release/js_tests.exe (the
      # doctest suite; it links no V8), so run it here instead of rebuilding it
      # from scratch in a second job.
      - name: Run tests
        shell: pwsh
        run: |
          .\Release\js_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d2bs-binaries
          path: |
            Release/js-v8-lod114d/d2bs.dll
            Release/js-v8-lod114d/d2bs.pdb
          retention-days: 1
          if-no-files-found: error

  api:
    name: API docs
    # Extracts the API surface with libclang and renders d2bsng.d.ts. It reads
    # only headers (the bindings' sources, the vendored V8 includes, the vcpkg
    # packages, MSVC + SDK), never the built DLL, so it runs alongside `build`
    # rather than after it. api.json + d.ts ship as release assets; the docs
    # site is assembled later (deploy-docs) from all releases.
    needs: version
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      # Pinned vcpkg commit (tool + builtin registry); matches builtin-baseline
      # in vcpkg.json. Bumping it deliberately invalidates the binary cache.
      VCPKG_REF: 9e44ec0e9f247d77c230ced0ee66c76296837807
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # LaunchOptions.cpp (a backend TU) pulls D2MOO headers
      # Restore only - `build` saves. On a cold cache (VCPKG_REF bump) this job
      # builds the deps from source too; that is a once-per-bump cost, accepted
      # so the extraction stays off the release's critical path.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'tests/frontends/js-v8/vcpkg.json') }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'tests/frontends/js-v8/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_REF }}-
      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkgDir = "$env:RUNNER_TEMP\vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg.git $vcpkgDir
          git -C $vcpkgDir checkout --quiet $env:VCPKG_REF
          & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Same install root MSBuild's vcpkg integration uses, so the headers land
      # where extract_api.py looks (vcpkg_installed/x86-windows-static/...).
      - name: Install vcpkg packages (headers)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x86-windows-static --x-manifest-root="$env:GITHUB_WORKSPACE" --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed\x86-windows-static"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
      - name: Generate API JSON + d.ts
        shell: pwsh
        run: |
          pip install --quiet libclang
          python scripts/extract_api.py -o api.json
          python scripts/gen_dts.py api.json -o d2bsng.d.ts --version "${{ needs.version.outputs.version }}"
      - name: Upload API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d2bs-api
          path: |
            api.json
            d2bsng.d.ts
          retention-days: 1
          if-no-files-found: error

  deploy-docs:
    name: Deploy docs
    # Runs after release so the just-published version's api.json asset exists.
    # Gathers every release's api.json server-side (no rate limits) into a
    # same-origin bundle the static page reads - no runtime GitHub API calls.
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build docs site from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate > releases.json
          python3 scripts/build_docs_site.py \
            --releases releases.json --data-dir data --out site \
            --repo "${{ github.repository }}" --download
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Release
    needs: [version, build, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # d2bs-binaries (dll + pdb) from `build`, d2bs-api (api.json + d.ts)
      # from `api`, flattened into one dist/.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: d2bs-*
          merge-multiple: true
          path: dist
      - name: Tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          repo_url="${{ github.server_url }}/${{ github.repository }}"

          # Previous vX.Y.Z tag - computed BEFORE we create this release's tag, so
          # `tail -1` is the prior release and not the one we are about to make.
          # Empty on the first release. (Same vX.Y.Z-only filter as the version job,
          # ignoring the v8-... libs tag.)
          prev=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

          # We push straight to master, so there are no PRs for `--generate-notes`
          # to summarize - it would produce empty notes. Build the notes ourselves
          # from the commits since the previous tag, each linking to its commit.
          # The format (a `-` list of `[`hash`](url)` links + a bare compare URL)
          # renders on both the GitHub release page and the docs Changelog, whose
          # minimal markdown renderer (scripts/gen_api_docs.py `md()`) supports
          # lists, inline code, [text](url) links, and bare-URL autolinking.
          bt='`'
          fmt="- %s ([${bt}%h${bt}](${repo_url}/commit/%H))"
          range="HEAD"
          [ -n "$prev" ] && range="${prev}..HEAD"
          {
            echo "## Commits"
            echo
            git log --no-merges --pretty=format:"$fmt" "$range"
            echo
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: ${repo_url}/compare/${prev}...${v}"
            fi
          } > notes.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$v"
          git push origin "$v"
          gh release create "$v" --notes-file notes.md --title "$v" \
            "dist/d2bs.dll#d2bs.dll" \
            "dist/d2bs.pdb#d2bs.pdb" \
            "dist/d2bsng.d.ts#d2bsng.d.ts" \
            "dist/api.json#api.json"

      - name: Announce on Discord
        # The release is already published by the time this runs, so a Discord
        # outage must not fail the workflow - the message is not worth a retry.
        # A missing secret (forks, or before the secret is set) skips silently.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "No DISCORD_RELEASE_WEBHOOK secret; skipping."; exit 0; }
          v="v${{ needs.version.outputs.version }}"
          repo_url="${{ github.server_url }}/${{ github.repository }}"
          dl="${repo_url}/releases/download/${v}"
          # Discord caps an embed description at 4096 chars. Truncate the notes
          # well short of that to leave room for the download line, then run the
          # cut through iconv so a byte-wise chop cannot leave a half-written
          # UTF-8 sequence that jq would reject.
          {
            head -c 3500 notes.md | iconv -c -f UTF-8 -t UTF-8
            printf '\n\n**Download:** [d2bs.dll](%s/d2bs.dll) | [d2bsng.d.ts](%s/d2bsng.d.ts) (TypeScript definitions)\n' "$dl" "$dl"
            printf '**API reference:** https://resurrectedtrader.github.io/d2bsng/\n'
          } > body.md
          # -Rs slurps the file as one JSON string, so no escaping by hand.
          jq -Rs --arg t "d2bsng $v" --arg u "${repo_url}/releases/tag/${v}" '{
            username: "d2bsng",
            embeds: [{ title: $t, url: $u, description: ., color: 15844367 }]
          }' body.md > payload.json
          curl -sSf -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK"
